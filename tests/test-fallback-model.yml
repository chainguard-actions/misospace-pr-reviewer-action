name: Test fallback model configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-fallback-base-url: "https://api.openai.com/v1"
          ai-fallback-model: "gpt-3.5-turbo"
          ai-fallback-api-format: "openai"
          ai-primary-retries: "2"
          ai-primary-retry-delay-sec: "5"
          pr-number: "1"
          ci-status-check: "false"
          tool-mode: "off"

      - name: Assert action ran with fallback model config (sentinel repo causes graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          ANALYSIS_ENGINE: ${{ steps.action.outputs.analysis-engine }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "analysis-engine: $ANALYSIS_ENGINE"
          echo "should-review: $SHOULD_REVIEW"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded with fallback model configured"
            echo "PASS: action completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
