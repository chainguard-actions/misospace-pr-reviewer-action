name: Test fallback model configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "fake-key-for-test"
          pr-number: "1"
          ai-fallback-base-url: "https://api.openai.com/v1"
          ai-fallback-model: "gpt-3.5-turbo"
          ai-fallback-api-key: "fake-key-for-test"
          ai-fallback-api-format: "openai"
          ai-primary-retries: "2"
          ai-primary-retry-delay-sec: "5"
          on-model-failure: "notice"
          ci-status-check: "false"
      - name: Assert fallback model config was accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          REVIEW_ROUTE: ${{ steps.action.outputs.review-route }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "review-route: $REVIEW_ROUTE"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            echo "PASS: action ran with fallback model configured"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo with no real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
