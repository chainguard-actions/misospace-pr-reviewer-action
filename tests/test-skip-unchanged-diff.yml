name: Test skip unchanged diff behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test skip_if_diff_unchanged=true behavior.
      # On first run (no prior managed comment), should_review should be true
      # because there's no prior fingerprint to compare against.
      # The AI endpoint is unreachable; on_model_failure=notice handles failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr_number: "1"
          ai_base_url: "http://127.0.0.1:19999"
          ai_model: "test-model"
          ai_api_key: "test-key"
          on_model_failure: "notice"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"
          publish_review_comment: "false"
          publish_mode: "comment"
          skip_if_diff_unchanged: "true"
          force_review: "false"

      - name: Assert action ran and diff_fingerprint is set
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIFF_FP: ${{ steps.action.outputs.diff_fingerprint }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          SKIP_REASON: ${{ steps.action.outputs.skip_reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "diff_fingerprint: $DIFF_FP"
          echo "should_review: $SHOULD_REVIEW"
          echo "skip_reason: $SKIP_REASON"
          # The action should run (success or failure), not produce an unexpected outcome
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success or failure)"
            exit 1
          fi
          # diff_fingerprint should be set by the precheck step
          if [ -n "$DIFF_FP" ]; then
            echo "PASS: diff_fingerprint is set: $DIFF_FP"
          else
            echo "WARN: diff_fingerprint is empty (precheck may not have completed)"
          fi
