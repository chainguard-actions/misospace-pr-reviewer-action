name: Test skip-if-diff-unchanged behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.anthropic.com"
          ai-api-format: "anthropic"
          ai-model: "claude-3-haiku-20240307"
          pr-number: "1"
          skip-if-diff-unchanged: "true"
          force-review: "false"
          ci-status-check: "false"
          tool-mode: "off"

      - name: Assert action ran and outputs are consistent
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
          SKIP_REASON: ${{ steps.action.outputs.skip-reason }}
          DIFF_FINGERPRINT: ${{ steps.action.outputs.diff-fingerprint }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should-review: $SHOULD_REVIEW"
          echo "skip-reason: $SKIP_REASON"
          echo "diff-fingerprint: $DIFF_FINGERPRINT"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            # If it skipped, skip-reason should be set
            if [ "$SHOULD_REVIEW" = "false" ] && [ -z "$SKIP_REASON" ]; then
              echo "FAIL: should-review=false but skip-reason is empty"
              exit 1
            fi
            echo "PASS: outputs are consistent"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
