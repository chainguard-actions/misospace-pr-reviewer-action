name: Test missing PR context error
# Tests that the action fails with a clear error when pr_number input is not
# provided and there is no pull_request event context (PR_NUMBER is empty).
# Under act, github.event.pull_request.number is empty for workflow_dispatch,
# so the precheck exits 1 immediately with "Missing REPO or PR_NUMBER".
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh CLI
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gh" /usr/local/bin/gh
          chmod +x /usr/local/bin/gh
          echo "Mock gh installed"

      - name: Run action without PR number (expect failure at precheck)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-test
          ai_base_url: https://203.0.113.1/v1
          ai_model: gpt-4o
          # No pr_number — should fail at precheck because PR_NUMBER is empty
          # (github.event.pull_request.number is empty for workflow_dispatch/push)
          on_model_failure: "fail"
          ai_request_timeout_sec: "3"
          ai_connect_timeout_sec: "3"
          ai_primary_retries: "0"

      - name: Assert action failed due to missing PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when PR number is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when PR number is missing"
