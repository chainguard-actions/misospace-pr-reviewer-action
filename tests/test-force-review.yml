name: Test force_review input
# Tests that force_review=true bypasses the diff-unchanged guard.
# The action will still fail at the GitHub API call (fake token),
# but we verify the force_review flag is accepted and processed.
on:
  workflow_dispatch:

jobs:
  test-force-review:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with force_review=true - expect failure at API call
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: fake-token-for-testing
          repo: owner/testrepo
          pr_number: "1"
          ai_base_url: http://localhost:11434/v1
          ai_model: test-model
          force_review: "true"
          skip_if_diff_unchanged: "true"

      - name: Assert action failed (expected - fake token cannot reach GitHub API)
        env:
          ACTUAL: ${{ steps.action.outcome }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "failure" ]; then
            echo "FAIL: expected 'failure' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid GitHub token (force_review was accepted)"
