name: Test force-review input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "invalid-key-for-test"
          pr-number: "1"
          ci-status-check: "false"
          on-model-failure: "notice"
          skip-if-diff-unchanged: "false"
          force-review: "true"
          ai-primary-retries: "0"
          ai-primary-retry-delay-sec: "0"
      - name: Assert action ran with force-review=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
          SKIP_REASON: ${{ steps.action.outputs.skip-reason }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should-review: $SHOULD_REVIEW"
          echo "skip-reason: $SKIP_REASON"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with force-review=true"
            # When force-review=true, should-review should not be false due to fingerprint match
            if [ "$SHOULD_REVIEW" = "false" ] && [ -n "$SKIP_REASON" ]; then
              echo "INFO: review was skipped for reason: $SKIP_REASON"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / invalid key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
