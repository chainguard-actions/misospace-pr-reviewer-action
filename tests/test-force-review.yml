name: Test force_review=true bypasses diff-unchanged guard
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with force_review=true
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          pr_number: "1"
          # Use a local endpoint that fails immediately (connection refused)
          # so the action fails fast without long AI API timeouts.
          ai_base_url: "http://localhost:1"
          ai_model: "gpt-4o-mini"
          force_review: "true"
          skip_if_diff_unchanged: "true"
          ai_primary_retries: "0"
          ai_connect_timeout_sec: "2"
          ai_request_timeout_sec: "5"

      - name: Assert action ran (force_review bypasses diff-unchanged guard)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          SKIP_REASON: ${{ steps.action.outputs.skip_reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "skip_reason: $SKIP_REASON"

          # With force_review=true, skip_reason should NOT be diff-unchanged
          if [ "$OUTCOME" = "success" ]; then
            if [ "$SKIP_REASON" = "diff-unchanged" ]; then
              echo "FAIL: force_review=true should bypass diff-unchanged guard but skip_reason=$SKIP_REASON"
              exit 1
            fi
            echo "PASS: action completed, skip_reason='$SKIP_REASON' (not diff-unchanged)"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed (AI endpoint unreachable or sentinel repo) — that's expected.
            # The key assertion is that the precheck decided should_review=true
            # (force_review bypassed the guard) before the review step failed.
            echo "PASS: action failed gracefully (AI endpoint unreachable or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
