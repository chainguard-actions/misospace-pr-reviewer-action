name: Test force-review bypasses diff-unchanged guard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "fake-key-for-test"
          pr-number: "1"
          force-review: "true"
          skip-if-diff-unchanged: "true"
          on-model-failure: "notice"
          ci-status-check: "false"
      - name: Assert force-review config was accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
          SKIP_REASON: ${{ steps.action.outputs.skip-reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should-review: $SHOULD_REVIEW"
          echo "skip-reason: $SKIP_REASON"
          # The action must not fail with a config/startup error
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo with no real PR)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Action succeeded — verify force-review bypassed the diff-unchanged guard.
          # Acceptable skip reasons under the sentinel repo:
          #   - pr-draft: the sentinel PR is a draft (not the diff-unchanged guard)
          #   - pr-not-found / 404: sentinel repo has no real PR
          # NOT acceptable: skip-reason=diff-unchanged (that would mean force-review was ignored)
          if [ "$SKIP_REASON" = "diff-unchanged" ]; then
            echo "FAIL: force-review=true should bypass the diff-unchanged guard, but skip-reason=$SKIP_REASON"
            exit 1
          fi
          if [ "$SHOULD_REVIEW" = "true" ]; then
            echo "PASS: force-review=true caused the action to proceed with review"
          else
            echo "PASS: action ran with force-review=true; skipped for reason '$SKIP_REASON' (not diff-unchanged)"
          fi
