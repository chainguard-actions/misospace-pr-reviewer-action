name: Test precheck with sentinel repo (graceful failure)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with a PR number against sentinel repo
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          pr_number: "1"
          platform: "github"
          # GITHUB_REPOSITORY is the sentinel (actionchain-harness/...) which
          # does not exist on GitHub — API calls will 404 or fail.
          # The action should fail gracefully rather than panic.
          # Minimize retry time so the test completes quickly.
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_connect_timeout_sec: "5"
          ai_request_timeout_sec: "10"

      - name: Assert action ran and failed gracefully on sentinel repo
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          SKIP_REASON: ${{ steps.action.outputs.skip_reason }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "skip_reason: $SKIP_REASON"
          echo "verdict: $VERDICT"

          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME' (sentinel repo handled gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
