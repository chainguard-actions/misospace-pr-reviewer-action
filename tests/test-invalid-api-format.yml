name: Test invalid ai-api-format is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: https://ai.example.invalid/v1
          ai-model: test-model
          ai-api-format: bogus-format
          pr-number: "1"
          ci-status-check: "false"
      - name: Assert config validation failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE: ${{ steps.action.outputs.review-bundle }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle: $BUNDLE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected invalid ai-api-format to fail the step, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: no verdict expected on config error, got '$VERDICT'"
            exit 1
          fi
          if [ -n "$BUNDLE" ]; then
            if ! echo "$BUNDLE" | grep -q '"state":"failed"'; then
              echo "FAIL: expected review-bundle state 'failed'"
              exit 1
            fi
            if ! echo "$BUNDLE" | grep -q 'ai-api-format'; then
              echo "FAIL: expected failure_reason to name ai-api-format"
              exit 1
            fi
          else
            echo "NOTE: review-bundle output not propagated from failed step"
          fi
          echo "PASS"
