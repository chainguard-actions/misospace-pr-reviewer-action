name: Test invalid ai_api_format fails at review step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock gh binary
        run: |
          mkdir -p /tmp/mock-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gh.sh" /tmp/mock-bin/gh
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - name: Run action with invalid ai_api_format (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: "test/repo"
          pr_number: "1"
          ai_base_url: "https://api.example.invalid/v1"
          ai_model: "test-model"
          # Invalid format — should fail with "Invalid AI_API_FORMAT"
          ai_api_format: "invalid_format"
          force_review: "true"
          skip_if_diff_unchanged: "false"
          publish_review_comment: "false"

      - name: Assert action failed due to invalid api format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid ai_api_format, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid ai_api_format"
