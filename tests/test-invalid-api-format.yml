name: Test invalid ai_api_format fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid ai_api_format
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://api.example.invalid/v1"
          ai_model: "gpt-4o"
          ai_api_format: "invalid_format"
          pr_number: "999999999"
          repo: ${{ github.repository }}
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert action failed due to invalid api format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail — either at config validation in run_review.sh
          # (invalid AI_API_FORMAT) or at the dependency check. Either way, the
          # step must not succeed.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid ai_api_format, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid ai_api_format"
