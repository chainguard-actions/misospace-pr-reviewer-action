name: Test invalid ai-api-format is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: http://127.0.0.1:9/v1
          ai-model: test-model
          ai-api-format: not-a-real-format
          ci-status-check: "false"
          ai-primary-retries: "0"
      - name: Assert action failed on invalid configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "should-review: $SHOULD_REVIEW"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid ai-api-format"
            exit 1
          fi
          if [ -n "$VERDICT" ] || [ -n "$SHOULD_REVIEW" ]; then
            echo "FAIL: no outputs expected when config is invalid"
            exit 1
          fi
          echo "PASS"
