name: Test model failure handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test on_model_failure=fail: when the AI endpoint is unreachable and
      # all retries are exhausted, the action should fail the step.
      # We use continue-on-error to capture the outcome and assert it failed.
      - id: action_fail
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr_number: "1"
          ai_base_url: "http://127.0.0.1:19999"
          ai_model: "test-model"
          ai_api_key: "test-key"
          on_model_failure: "fail"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"
          publish_review_comment: "false"
          publish_mode: "comment"
          skip_if_diff_unchanged: "false"
          force_review: "true"

      - name: Assert action failed gracefully on unreachable AI endpoint
        if: always()
        env:
          OUTCOME: ${{ steps.action_fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With on_model_failure=fail and an unreachable AI endpoint,
          # the action should fail (not succeed). However, the precheck step
          # may also fail if the sentinel repo is not accessible.
          # Either way, the action should not produce an unexpected outcome.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (model failure or sentinel repo API failure)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (precheck may have skipped the review)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected failure or success)"
            exit 1
          fi
