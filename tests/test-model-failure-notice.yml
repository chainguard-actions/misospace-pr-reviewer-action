name: Test on_model_failure=notice behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock gh CLI
        run: |
          mkdir -p /tmp/mock-bin
          printf '%s\n' '#!/usr/bin/env bash' \
            'ARGS="$*"' \
            'if echo "$ARGS" | grep -q "pr diff"; then printf ""; exit 0; fi' \
            'if echo "$ARGS" | grep -qE "issues/[0-9]+/comments"; then echo "[]"; exit 0; fi' \
            'if echo "$ARGS" | grep -qE "pulls/[0-9]+/reviews"; then echo "[]"; exit 0; fi' \
            'if echo "$ARGS" | grep -qE "pulls/[0-9]+/files"; then echo "[]"; exit 0; fi' \
            'if echo "$ARGS" | grep -qE "pulls/[0-9]+"; then echo "{\"number\":42,\"title\":\"Test PR\",\"body\":\"\",\"head\":{\"sha\":\"abc123def456abc123def456abc123def456abc123\",\"ref\":\"feature\",\"repo\":{\"full_name\":\"owner/repo\"}},\"base\":{\"sha\":\"def456abc123def456abc123def456abc123def456\",\"ref\":\"main\",\"repo\":{\"full_name\":\"owner/repo\"}},\"user\":{\"login\":\"testuser\"},\"changed_files\":0,\"additions\":0,\"deletions\":0,\"html_url\":\"https://github.com/owner/repo/pull/42\"}"; exit 0; fi' \
            'if echo "$ARGS" | grep -q "pr comment"; then exit 0; fi' \
            'echo "[]"' \
            'exit 0' \
            > /tmp/mock-bin/gh
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - name: Run action with on_model_failure=notice
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: fake-token
          ai_base_url: http://localhost:1
          ai_model: test-model
          repo: owner/repo
          pr_number: "42"
          on_model_failure: "notice"
          force_review: "true"
          skip_if_diff_unchanged: "false"
          ai_primary_retries: "0"
          ai_primary_retry_delay_sec: "0"
          publish_review_comment: "false"
        env:
          GITHUB_EVENT_NAME: pull_request
          GH_TOKEN: fake-token

      - name: Assert precheck ran and set should_review
        env:
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          # The precheck step should have run and set should_review=true
          # (force_review=true bypasses the diff-unchanged guard)
          if [ -z "$SHOULD_REVIEW" ]; then
            echo "FAIL: should_review output was not set by precheck step"
            exit 1
          fi
          echo "PASS: precheck ran (should_review=$SHOULD_REVIEW), action outcome=$OUTCOME"
