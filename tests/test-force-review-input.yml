name: Test force_review input
# When force_review=true, the action bypasses the diff-unchanged guard.
# With a PR number provided, the precheck should set should_review=true
# regardless of any prior fingerprint. The review step will fail because
# the AI endpoint is unreachable — that is expected.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          pr_number: "1"
          ai_base_url: "http://localhost:19999/v1"
          ai_model: "test-model"
          force_review: "true"
          # Reduce retries so the test doesn't take too long
          ai_primary_retries: "0"
          ai_primary_retry_delay_sec: "0"
          on_model_failure: "fail"
          publish_review_comment: "false"

      - name: Assert action ran (force_review bypasses diff-unchanged guard)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"

          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped — a prior step must have failed"
            exit 1
          fi

          # The action should fail because the AI endpoint is unreachable,
          # but the precheck should have set should_review=true (force_review bypasses guard).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (AI endpoint unreachable or sentinel repo as expected with force_review=true)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$SHOULD_REVIEW" = "true" ]; then
              echo "PASS: action succeeded with should_review=true"
            else
              echo "FAIL: action succeeded but should_review is not 'true': $SHOULD_REVIEW"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
