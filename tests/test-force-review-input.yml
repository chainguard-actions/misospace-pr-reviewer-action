name: Test force_review and skip inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts force_review=true and skip_if_diff_unchanged=false
      # without crashing on input parsing. The action will fail at the review step
      # because the PR number is fake (doesn't exist in the repo), which confirms
      # the action got past input validation successfully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          pr_number: "999999"
          ai_base_url: "https://api.example.invalid/v1"
          ai_model: "gpt-4o"
          force_review: "true"
          skip_if_diff_unchanged: "false"
          on_model_failure: "fail"
          publish_mode: "comment"
          review_scope: "full"
          context_limit_mode: "normal"
          ai_max_tokens: "8192"
          ai_temperature: "0.1"
          ai_response_format: "off"
          ai_tokens_param: "max_tokens"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert action failed at review not at input validation
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the PR doesn't exist (fake PR number),
          # not because the inputs were invalid.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (fake PR / no AI endpoint)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (may have skipped review)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
