name: Test force_review input
# Tests that the force_review=true input is accepted and the action
# attempts to run a review (bypassing the diff-unchanged guard).
# With a mock gh and on_model_failure=notice, the action succeeds.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
      GITHUB_HEAD_REF: my-feature
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh CLI
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gh" /usr/local/bin/gh
          chmod +x /usr/local/bin/gh
          echo "Mock gh installed"

      - name: Run action with force_review=true
        id: action
        uses: .
        with:
          github_token: fake-token-for-test
          ai_base_url: https://203.0.113.1/v1
          ai_model: gpt-4o
          repo: owner/repo
          pr_number: "1"
          force_review: "true"
          skip_if_diff_unchanged: "true"
          on_model_failure: "notice"
          ai_request_timeout_sec: "3"
          ai_connect_timeout_sec: "3"
          ai_primary_retries: "0"

      - name: Assert should_review is true (force_review bypassed the guard)
        env:
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "should_review: $SHOULD_REVIEW"
          if [ "$SHOULD_REVIEW" != "true" ]; then
            echo "FAIL: expected should_review=true with force_review=true, got: '$SHOULD_REVIEW'"
            exit 1
          fi
          echo "PASS: force_review=true was accepted and should_review=true"

      - name: Assert verdict is set (model failure notice was produced)
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "verdict: $VERDICT"
          if [ -z "$VERDICT" ]; then
            echo "FAIL: expected verdict to be set, got empty"
            exit 1
          fi
          echo "PASS: verdict is set: $VERDICT"
