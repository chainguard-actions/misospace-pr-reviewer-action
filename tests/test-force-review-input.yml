name: Test force_review input bypasses diff-unchanged guard
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with force_review=true
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          pr_number: "1"
          platform: "github"
          force_review: "true"
          skip_if_diff_unchanged: "true"
          # force_review=true should bypass the diff-unchanged guard.
          # The action will still fail on the sentinel repo API calls,
          # but the precheck should set should_review=true before that.
          # Minimize retry time so the test completes quickly.
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_connect_timeout_sec: "5"
          ai_request_timeout_sec: "10"

      - name: Assert action ran (force_review input was accepted)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          DIFF_FINGERPRINT: ${{ steps.action.outputs.diff_fingerprint }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "diff_fingerprint: $DIFF_FINGERPRINT"

          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME' (force_review input accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
