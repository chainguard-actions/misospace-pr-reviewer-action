name: Test review routing mode input
# Tests that the review_routing_mode=auto input and associated smart model
# configuration inputs are accepted by the action without input validation
# errors. The action should fail at the precheck step (missing REPO/PR_NUMBER)
# rather than at input parsing.
on:
  workflow_dispatch:

jobs:
  test-routing-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install GitHub CLI (gh) if not present
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update -qq
            apt-get install -y -qq gh
          fi
          gh --version

      - name: Run action with review_routing_mode=auto and smart model
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          ai_base_url: http://localhost:11434/v1
          ai_model: fast-model
          review_routing_mode: auto
          ai_smart_model: smart-model
          ai_smart_base_url: http://localhost:11434/v1
          ai_smart_api_format: openai
          escalate_on_risk_flags: "linked_security_issue,auth_changes"
          escalate_on_fast_request_changes: "true"
          escalate_on_fast_low_confidence: "true"
          repo: ""
          pr_number: ""

      - name: Assert action failed at precheck (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at precheck, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: review_routing_mode=auto inputs were accepted; action failed at precheck as expected"
