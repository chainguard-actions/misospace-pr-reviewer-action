name: Test on_model_failure=notice configuration
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with on_model_failure=notice
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          pr_number: "1"
          # Use a local endpoint that fails immediately (connection refused)
          # to force model failure quickly without long timeouts.
          ai_base_url: "http://localhost:1"
          ai_model: "gpt-4o-mini"
          on_model_failure: "notice"
          ai_primary_retries: "0"
          ai_connect_timeout_sec: "2"
          ai_request_timeout_sec: "5"

      - name: Assert action ran (failed gracefully on sentinel repo or model failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          SKIP_REASON: ${{ steps.action.outputs.skip_reason }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "skip_reason: $SKIP_REASON"
          echo "verdict: $VERDICT"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — should_review must be set
            if [ -z "$SHOULD_REVIEW" ]; then
              echo "FAIL: action succeeded but should_review output is empty"
              exit 1
            fi
            echo "PASS: action completed with should_review=$SHOULD_REVIEW"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or AI endpoint unreachable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
