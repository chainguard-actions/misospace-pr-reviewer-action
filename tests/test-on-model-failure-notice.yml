name: Test on_model_failure=notice configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that on_model_failure=notice is accepted as a valid input.
      # Also tests verdict_policy=findings_severity_gated and
      # review_routing_mode=off inputs are accepted.
      # Use a localhost AI endpoint and 0 retries so the action fails fast.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: http://127.0.0.1:1
          ai_model: test-model
          pr_number: "99999999"
          repo: "actions/checkout"
          on_model_failure: "notice"
          verdict_policy: "findings_severity_gated"
          review_routing_mode: "off"
          ai_max_tokens: "4096"
          ai_temperature: "0.1"
          ai_response_format: "off"
          context_limit_mode: "low"
          ai_primary_retries: "0"
          ai_connect_timeout_sec: "2"
          ai_request_timeout_sec: "5"

      - name: Assert action ran with notice configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (inputs accepted, failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
