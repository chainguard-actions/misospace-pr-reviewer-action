name: Test on_model_failure=notice input
# Tests that the on_model_failure=notice input is accepted by the action.
# The action will fail at the GitHub API call (fake token), but we verify
# the input is recognized and the action starts correctly.
on:
  workflow_dispatch:

jobs:
  test-on-model-failure-notice:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/5/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with on_model_failure=notice
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: fake-token-for-testing
          repo: owner/testrepo
          pr_number: "5"
          ai_base_url: http://localhost:11434/v1
          ai_model: test-model
          on_model_failure: notice
          ai_primary_retries: "0"
          ai_primary_retry_delay_sec: "0"

      - name: Assert action failed (expected - fake token/API)
        env:
          ACTUAL: ${{ steps.action.outcome }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "failure" ]; then
            echo "FAIL: expected 'failure' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: action correctly failed (on_model_failure=notice was accepted)"
