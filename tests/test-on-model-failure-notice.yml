name: Test - on_model_failure=notice graceful degradation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with on_model_failure=notice and unreachable AI endpoint
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://localhost:19999/v1"
          ai_model: "test-model"
          pr_number: ""
          on_model_failure: "notice"
          skip_if_diff_unchanged: "false"
          force_review: "false"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"

      - name: Assert action handled model failure gracefully
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "verdict: $VERDICT"
          # With on_model_failure=notice and no PR number:
          # - The precheck exits immediately (missing PR_NUMBER) → action fails
          # With on_model_failure=notice and an unreachable AI endpoint:
          # - If the action reached the model call: it should succeed (notice mode)
          # Either outcome is acceptable — the test verifies the action does not
          # hang or produce an unexpected outcome.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (on_model_failure=notice worked or review was skipped)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR context or sentinel repo not resolvable)"
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped — a prior step may have failed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
