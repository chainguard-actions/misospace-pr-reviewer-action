name: Test on_model_failure=notice behavior
# Tests that when on_model_failure=notice is set, the action does not
# hard-fail the step even when the AI model is unreachable. Instead it
# should post a notice. This exercises the on_model_failure input path.
# Since we cannot reach a real AI API, we expect the action to fail at
# the review step (not the precheck), and we verify the failure mode.
on:
  workflow_dispatch:

jobs:
  test-model-failure-notice:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install GitHub CLI (gh) if not present
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update -qq
            apt-get install -y -qq gh
          fi
          gh --version

      - name: Run action with on_model_failure=notice and unreachable AI
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          ai_base_url: http://localhost:11434/v1
          ai_model: test-model
          on_model_failure: notice
          repo: ""
          pr_number: ""

      - name: Assert action failed at precheck (missing REPO/PR_NUMBER)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because REPO and PR_NUMBER are not set.
          # on_model_failure=notice only affects the review step, not the precheck.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at precheck, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at precheck stage"
