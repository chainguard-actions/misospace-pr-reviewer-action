name: Test on_model_failure=notice input
# Tests that the on_model_failure=notice configuration causes the action to
# succeed even when the AI API is unreachable, producing a request_changes
# verdict with a notice message instead of failing the step.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/10/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh CLI
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gh" /usr/local/bin/gh
          chmod +x /usr/local/bin/gh
          echo "Mock gh installed"

      - name: Run action with on_model_failure=notice
        id: action
        uses: .
        with:
          github_token: fake-token-for-test
          ai_base_url: https://203.0.113.1/v1
          ai_model: gpt-4o
          repo: owner/repo
          pr_number: "1"
          on_model_failure: "notice"
          skip_if_diff_unchanged: "false"
          ai_request_timeout_sec: "3"
          ai_connect_timeout_sec: "3"
          ai_primary_retries: "0"

      - name: Assert action succeeded (on_model_failure=notice prevents step failure)
        env:
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "should_review: $SHOULD_REVIEW"
          echo "verdict: $VERDICT"
          if [ "$SHOULD_REVIEW" != "true" ]; then
            echo "FAIL: expected should_review=true, got: '$SHOULD_REVIEW'"
            exit 1
          fi
          # With on_model_failure=notice, verdict should be request_changes
          if [ "$VERDICT" != "request_changes" ]; then
            echo "FAIL: expected verdict=request_changes from notice mode, got: '$VERDICT'"
            exit 1
          fi
          echo "PASS: on_model_failure=notice produced request_changes verdict without failing the step"
