name: Test on_model_failure=notice input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with on_model_failure=notice and nonexistent PR
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://api.example.invalid/v1"
          ai_model: "gpt-4o"
          pr_number: "999999999"
          repo: ${{ github.repository }}
          on_model_failure: "notice"
          force_review: "false"
          skip_if_diff_unchanged: "true"
          publish_mode: "comment"
          publish_review_comment: "false"
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert action failed at PR lookup (on_model_failure=notice input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # on_model_failure=notice only affects the model call step, not the
          # context-gathering step. With a nonexistent PR, the action fails at
          # context gathering (before reaching the model call), so the action
          # must fail regardless of on_model_failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when PR does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed at PR lookup; on_model_failure=notice input was accepted"
