name: Test context-limit-mode and model-context-tokens configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "http://127.0.0.1:19999/v1"
          ai-model: "test-model"
          ai-api-key: "test-key"
          pr-number: "1"
          on-model-failure: "notice"
          context-limit-mode: "low"
          model-context-tokens: "32768"
          ai-max-tokens: "4096"
          ci-status-check: "false"
          tool-mode: "off"
          ai-primary-retries: "0"

      - name: Assert action ran with context limit configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ANALYSIS_ENGINE: ${{ steps.action.outputs.analysis-engine }}
        run: |
          echo "outcome: $OUTCOME"
          echo "analysis-engine: $ANALYSIS_ENGINE"
          # The action should either succeed or fail gracefully on the sentinel repo.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with expected outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
