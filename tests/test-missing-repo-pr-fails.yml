name: Test missing repo and PR number fails
# Tests that the action's precheck step fails with a clear error when
# REPO and PR_NUMBER are not provided. This exercises the early-exit
# guard in check_review_needed.sh.
on:
  workflow_dispatch:

jobs:
  test-missing-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install GitHub CLI (gh) if not present
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update -qq
            apt-get install -y -qq gh
          fi
          gh --version

      - name: Run action with missing repo and PR number
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          ai_base_url: http://localhost:11434/v1
          ai_model: test-model

      - name: Assert action failed due to missing REPO and PR_NUMBER
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when REPO and PR_NUMBER are missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when REPO and PR_NUMBER were not provided"
