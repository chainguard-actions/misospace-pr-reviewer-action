name: Test graceful failure on sentinel repo
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The sentinel GITHUB_REPOSITORY does not correspond to a real repo.
      # The action's precheck step handles API failures gracefully (empty diff,
      # empty PR object) but the review step will fail when it tries to fetch
      # the PR object from the sentinel repo.
      # We assert that the action ran (not skipped/cancelled) and either
      # succeeded or failed gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr_number: "1"
          ai_base_url: "https://localhost:19999/v1"
          ai_model: "test-model"
          ai_request_timeout_sec: "3"
          ai_connect_timeout_sec: "2"
          ai_primary_retries: "0"
          on_model_failure: "fail"

      - name: Assert action ran and failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          case "$OUTCOME" in
            failure)
              echo "PASS: action failed gracefully as expected (sentinel repo / no real PR)"
              ;;
            success)
              echo "INFO: action unexpectedly succeeded — this may happen if the sentinel"
              echo "INFO: repo happens to have PR #1 or if the action degrades gracefully"
              echo "PASS: action ran without crashing"
              ;;
            "")
              # Empty outcome may occur in some act versions; use file-based check
              echo "INFO: outcome expression returned empty — checking files instead"
              if [ -f pr.diff ]; then
                echo "PASS: pr.diff found — precheck ran (action started correctly)"
              else
                echo "INFO: pr.diff not found — action may have failed at dependency check"
                echo "PASS: sentinel repo graceful failure test complete"
              fi
              ;;
            skipped|cancelled)
              echo "FAIL: action was $OUTCOME — it should have run"
              exit 1
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
