name: Test publish-mode=review_comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "invalid-key-for-test"
          pr-number: "1"
          ci-status-check: "false"
          on-model-failure: "notice"
          publish-mode: "review_comment"
          ai-primary-retries: "0"
          ai-primary-retry-delay-sec: "0"
      - name: Assert action ran with review_comment publish mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          REVIEW_MARKDOWN: ${{ steps.action.outputs.review-markdown }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "should-review: $SHOULD_REVIEW"
          echo "review-markdown length: ${#REVIEW_MARKDOWN}"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with review_comment publish mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / invalid key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
