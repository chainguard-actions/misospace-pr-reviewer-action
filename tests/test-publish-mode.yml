name: Test publish-mode review_verdict configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "fake-key-for-test"
          pr-number: "1"
          publish-mode: "review_verdict"
          allow-approve: "false"
          on-model-failure: "notice"
          ci-status-check: "false"
      - name: Assert publish-mode config was accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_SOURCE: ${{ steps.action.outputs.verdict-source }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "verdict-source: $VERDICT_SOURCE"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            echo "PASS: action ran with publish-mode=review_verdict"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo with no real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
