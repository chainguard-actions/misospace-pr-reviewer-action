name: Test publish-mode and fail-on-request-changes inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          pr-number: "1"
          publish-mode: "comment"
          publish-review-comment: "true"
          fail-on-request-changes: "false"
          on-model-failure: "notice"
          ci-status-check: "false"
          tool-mode: "off"

      - name: Assert action ran with publish-mode=comment (sentinel repo causes graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          REVIEW_MARKDOWN: ${{ steps.action.outputs.review-markdown }}
          ANALYSIS_ENGINE: ${{ steps.action.outputs.analysis-engine }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "analysis-engine: $ANALYSIS_ENGINE"
          echo "review-markdown length: ${#REVIEW_MARKDOWN}"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -n "$VERDICT" ]; then
              echo "verdict is set: $VERDICT"
              # Verdict must be approve or request_changes
              if [ "$VERDICT" != "approve" ] && [ "$VERDICT" != "request_changes" ]; then
                echo "FAIL: unexpected verdict value '$VERDICT'"
                exit 1
              fi
            fi
            echo "PASS: action completed with valid outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
