name: Test no pull request context (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under workflow_dispatch there is no pull_request event and no pr-number,
      # so the precheck cannot resolve a PR and the action must fail closed
      # (never fabricate a review/approval).
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: https://ai.example.invalid/v1
          ai-model: test-model
          ci-status-check: "false"
          tool-mode: "off"
      - name: Assert the action failed closed with a failed bundle
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE: ${{ steps.action.outputs.review-bundle }}
          ATTESTATION: ${{ steps.action.outputs.review-attestation }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle: $BUNDLE"
          echo "attestation: $ATTESTATION"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail without a PR, got '$OUTCOME'"
            exit 1
          fi
          if [ "$VERDICT" = "approve" ]; then
            echo "FAIL: action must never approve without a PR"
            exit 1
          fi
          if [ -n "$BUNDLE" ]; then
            if ! echo "$BUNDLE" | grep -q '"state":"failed"'; then
              echo "FAIL: expected review-bundle state 'failed'"
              exit 1
            fi
          else
            echo "NOTE: review-bundle output not propagated from failed step"
          fi
          if [ -n "$ATTESTATION" ]; then
            if echo "$ATTESTATION" | grep -q '"conclusion":"approved"'; then
              echo "FAIL: attestation must not be approved"
              exit 1
            fi
            if ! echo "$ATTESTATION" | grep -q '"conclusion":"unavailable"'; then
              echo "FAIL: expected attestation conclusion 'unavailable'"
              exit 1
            fi
          fi
          echo "PASS"
