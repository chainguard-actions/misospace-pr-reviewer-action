name: Test missing PR number fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake gh to intercept PR API calls
        run: |
          mkdir -p /tmp/fake-bin
          REAL_GH="$(command -v gh || echo /usr/bin/gh)"
          echo "REAL_GH=$REAL_GH" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" /tmp/fake-bin/gh
          chmod +x /tmp/fake-bin/gh
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Run action with missing PR number (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # pr_number intentionally omitted — precheck must exit 1
          repo: ${{ github.repository }}
          ai_base_url: "http://127.0.0.1:19999"
          ai_model: "test-model"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "2"

      - name: Assert action failed due to missing PR number
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pr_number is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when pr_number was not provided"
