name: Test tool mode off (no tool harness)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "test-key-not-real"
          tool-mode: "off"
          pr-number: "1"
          on-model-failure: "notice"
          ci-status-check: "false"
          ai-primary-retries: "0"
      - name: Assert action ran with tool mode off or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          TOOL_CALLS: ${{ steps.action.outputs.tool-calls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "tool-calls: $TOOL_CALLS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with tool mode off"
            if [ -n "$TOOL_CALLS" ] && [ "$TOOL_CALLS" != "[]" ]; then
              echo "WARN: tool-calls output is non-empty despite tool-mode=off: $TOOL_CALLS"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or invalid API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
