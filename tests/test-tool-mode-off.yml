name: Test tool-mode=off (no native tool loop)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          pr-number: "1"
          tool-mode: "off"
          on-model-failure: "notice"
          ci-status-check: "false"
      - name: Assert action ran with tool-mode=off
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          TOOL_CALLS: ${{ steps.action.outputs.tool-calls }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "tool-calls: $TOOL_CALLS"
          echo "should-review: $SHOULD_REVIEW"
          # The action should either succeed or fail gracefully.
          # With the sentinel repo, PR fetch will fail before reaching tool mode.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with tool-mode=off"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable, expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
