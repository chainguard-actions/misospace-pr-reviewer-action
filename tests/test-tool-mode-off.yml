name: Test tool-mode=off (no native tool loop)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "fake-key-for-test"
          pr-number: "1"
          ci-status-check: "false"
          publish-review-comment: "false"
          on-model-failure: "notice"
          tool-mode: "off"
          deep-review: "false"
          related-code-context: "false"
          repo-map-context: "false"
          pr-thread-context: "false"
          review-threads-context: "false"
      - name: Assert action ran with tool-mode=off or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          TOOL_CALLS: ${{ steps.action.outputs.tool-calls }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "tool-calls: $TOOL_CALLS"
          echo "should-review: $SHOULD_REVIEW"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with tool-mode=off"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
