name: Test publish_mode input accepted
# Tests that the publish_mode input (review_verdict, review_comment, comment)
# is accepted by the action without input validation errors. The action should
# fail at the precheck step (missing REPO/PR_NUMBER) rather than at input
# parsing, confirming publish_mode is a recognized and valid input.
on:
  workflow_dispatch:

jobs:
  test-publish-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install GitHub CLI (gh) if not present
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update -qq
            apt-get install -y -qq gh
          fi
          gh --version

      - name: Run action with publish_mode=review_verdict
        id: action-verdict
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          ai_base_url: http://localhost:11434/v1
          ai_model: test-model
          publish_mode: review_verdict
          allow_approve: "false"
          repo: ""
          pr_number: ""

      - name: Assert action failed at precheck (not at input validation)
        env:
          OUTCOME: ${{ steps.action-verdict.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at precheck, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: publish_mode=review_verdict input was accepted; action failed at precheck as expected"

      - name: Run action with publish_mode=review_comment
        id: action-comment
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          ai_base_url: http://localhost:11434/v1
          ai_model: test-model
          publish_mode: review_comment
          repo: ""
          pr_number: ""

      - name: Assert review_comment mode also fails at precheck
        env:
          OUTCOME: ${{ steps.action-comment.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at precheck, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: publish_mode=review_comment input was accepted; action failed at precheck as expected"
