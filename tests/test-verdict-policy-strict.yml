name: Test verdict-policy=strict
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "invalid-key-for-test"
          pr-number: "1"
          ci-status-check: "false"
          on-model-failure: "notice"
          verdict-policy: "strict"
          ai-primary-retries: "0"
          ai-primary-retry-delay-sec: "0"
      - name: Assert action ran with strict verdict policy
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_SOURCE: ${{ steps.action.outputs.verdict-source }}
          REVIEW_RESULT: ${{ steps.action.outputs.review-result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "verdict-source: $VERDICT_SOURCE"
          echo "review-result: $REVIEW_RESULT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with strict verdict policy"
            # If verdict is set, it should be one of the valid values
            if [ -n "$VERDICT" ]; then
              if [ "$VERDICT" = "approve" ] || [ "$VERDICT" = "request_changes" ]; then
                echo "PASS: verdict is a valid value: $VERDICT"
              else
                echo "FAIL: unexpected verdict value: $VERDICT"
                exit 1
              fi
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / invalid key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
