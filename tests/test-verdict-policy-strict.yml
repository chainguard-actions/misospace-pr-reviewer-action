name: Test verdict-policy=strict mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "test-key-not-used"
          pr-number: "1"
          verdict-policy: "strict"
          on-model-failure: "notice"
          ci-status-check: "false"
          inline-findings: "true"
          inline-findings-max: "10"
      - name: Assert action ran and either produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_SOURCE: ${{ steps.action.outputs.verdict-source }}
          REVIEW_RESULT: ${{ steps.action.outputs.review-result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "verdict-source: $VERDICT_SOURCE"
          echo "review-result: $REVIEW_RESULT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
