name: Test verdict-policy=strict configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "test-key-not-used"
          pr-number: "1"
          verdict-policy: "strict"
          fail-on-request-changes: "false"
          on-model-failure: "notice"
          ci-status-check: "false"
          publish-review-comment: "false"
          tool-mode: "off"
          validate-required-checks: "false"
      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_SOURCE: ${{ steps.action.outputs.verdict-source }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "verdict-source: $VERDICT_SOURCE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            if [ -n "$VERDICT" ]; then
              echo "verdict output: $VERDICT"
              if [ "$VERDICT" != "approve" ] && [ "$VERDICT" != "request_changes" ]; then
                echo "FAIL: unexpected verdict value '$VERDICT'"
                exit 1
              fi
              echo "PASS: verdict is valid"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
