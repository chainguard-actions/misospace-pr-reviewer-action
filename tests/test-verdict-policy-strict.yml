name: Test verdict-policy=strict (v3 default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "fake-key-for-test"
          pr-number: "1"
          ci-status-check: "false"
          publish-review-comment: "false"
          on-model-failure: "notice"
          verdict-policy: "strict"
          fail-on-request-changes: "false"
          inline-findings: "true"
          inline-findings-max: "20"
      - name: Assert action ran with strict verdict policy or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_SOURCE: ${{ steps.action.outputs.verdict-source }}
          REVIEW_RESULT: ${{ steps.action.outputs.review-result }}
          REQUIRED_CHECKS: ${{ steps.action.outputs.required-checks }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "verdict-source: $VERDICT_SOURCE"
          echo "review-result: $REVIEW_RESULT"
          echo "required-checks: $REQUIRED_CHECKS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with strict verdict policy"
            # If verdict is set, it must be one of the valid values
            if [ -n "$VERDICT" ]; then
              if [ "$VERDICT" != "approve" ] && [ "$VERDICT" != "request_changes" ]; then
                echo "FAIL: unexpected verdict value '$VERDICT'"
                exit 1
              fi
              echo "PASS: verdict '$VERDICT' is valid"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
