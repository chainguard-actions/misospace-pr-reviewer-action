name: Test verdict-policy=strict (v3 default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          pr-number: "1"
          verdict-policy: "strict"
          on-model-failure: "notice"
          publish-mode: "review_comment"
      - name: Assert action ran with strict verdict policy
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_SOURCE: ${{ steps.action.outputs.verdict-source }}
          REVIEW_RESULT: ${{ steps.action.outputs.review-result }}
          REQUIRED_CHECKS: ${{ steps.action.outputs.required-checks }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "verdict-source: $VERDICT_SOURCE"
          echo "review-result: $REVIEW_RESULT"
          echo "required-checks: $REQUIRED_CHECKS"
          # The action should either succeed or fail gracefully.
          # With the sentinel repo, PR fetch will fail before reaching verdict policy.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with strict verdict policy"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable, expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
