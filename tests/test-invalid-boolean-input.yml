name: Test invalid boolean input is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: http://127.0.0.1:9/v1
          ai-model: test-model
          pr-number: "1"
          ci-status-check: "false"
          tool-mode: "off"
          fail-on-request-changes: "maybe"
      - name: Assert configuration error recorded in failed bundle
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE: ${{ steps.action.outputs.review-bundle }}
          ATTEST: ${{ steps.action.outputs.review-attestation }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle: $BUNDLE"
          echo "attestation: $ATTEST"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected config validation to fail the step"
            exit 1
          fi
          echo "$BUNDLE" | grep -q '"state":"failed"' || { echo "FAIL: bundle state is not failed"; exit 1; }
          echo "$BUNDLE" | grep -q 'fail-on-request-changes' || { echo "FAIL: failure_reason does not name the bad input"; exit 1; }
          echo "$ATTEST" | grep -q '"conclusion":"unavailable"' || { echo "FAIL: attestation not unavailable"; exit 1; }
          if [ -n "$VERDICT" ]; then
            echo "FAIL: no verdict expected, got '$VERDICT'"
            exit 1
          fi
          echo "PASS"
