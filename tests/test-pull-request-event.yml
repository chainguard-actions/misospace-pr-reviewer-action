name: Test pull request event context
# Tests the action under a pull_request event context with a valid-looking
# repo and PR number. The action will fail at the GitHub API call (fake token),
# but we verify it gets past dependency validation and into the precheck step.
on:
  workflow_dispatch:

jobs:
  test-pull-request-event:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with pull_request context - expect failure at API call
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: fake-token-for-testing
          repo: owner/testrepo
          pr_number: "42"
          ai_base_url: http://localhost:11434/v1
          ai_model: test-model
          skip_if_diff_unchanged: "false"
          force_review: "false"

      - name: Assert action failed (expected - fake token cannot reach GitHub API)
        env:
          ACTUAL: ${{ steps.action.outcome }}
        run: |
          echo "actual: $ACTUAL"
          # The action should fail because the fake token cannot authenticate
          # with the GitHub API. This is expected behavior.
          if [ "$ACTUAL" != "failure" ]; then
            echo "FAIL: expected 'failure' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid GitHub token"
