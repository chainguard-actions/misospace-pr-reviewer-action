name: Test review_routing_mode=auto
# Tests that review_routing_mode=auto with primary and smart models is accepted.
# The action will fail at the GitHub API call (fake token), but we verify
# the routing mode inputs are recognized and the action starts correctly.
on:
  workflow_dispatch:

jobs:
  test-review-routing-auto:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/3/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with review_routing_mode=auto
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: fake-token-for-testing
          repo: owner/testrepo
          pr_number: "3"
          ai_base_url: http://localhost:11434/v1
          ai_model: fast-model
          review_routing_mode: auto
          ai_primary_model: fast-model
          ai_smart_model: smart-model
          ai_smart_base_url: http://localhost:11434/v1
          escalate_on_risk_flags: "auth_changes,db_or_migration_changes"
          escalate_on_fast_request_changes: "true"
          escalate_on_fast_low_confidence: "true"

      - name: Assert action failed (expected - fake token/API)
        env:
          ACTUAL: ${{ steps.action.outcome }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "failure" ]; then
            echo "FAIL: expected 'failure' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: action correctly failed (review_routing_mode=auto was accepted)"
