name: Test - No PR context (should fail gracefully)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no PR number (expect graceful failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://localhost:19999/v1"
          ai_model: "test-model"
          pr_number: ""
          skip_if_diff_unchanged: "false"
          force_review: "false"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"

      - name: Assert action failed gracefully with no PR context
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          SKIP_REASON: ${{ steps.action.outputs.skip_reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "skip_reason: $SKIP_REASON"
          # With no PR number and no pull_request event context, the precheck
          # script exits immediately with code 1 ("Missing REPO or PR_NUMBER").
          # The action step must fail (not hang, not be skipped).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR number available)"
          elif [ "$OUTCOME" = "success" ]; then
            # Acceptable if the action somehow skipped the review
            if [ "$SHOULD_REVIEW" = "false" ]; then
              echo "PASS: action skipped review (should_review=false)"
            else
              echo "PASS: action completed (should_review=$SHOULD_REVIEW)"
            fi
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped — a prior step may have failed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
