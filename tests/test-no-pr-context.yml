name: Test no pull request context (workflow_dispatch, no pr-number)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under workflow_dispatch there is no PR number, so precheck refuses with
      # "Missing REPO or PR_NUMBER". The action must fail AND still leave a
      # deterministic 'failed' review bundle and an 'unavailable' attestation.
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: http://127.0.0.1:9/v1
          ai-model: test-model
          ci-status-check: "false"
          tool-mode: "off"
      - name: Assert failure with failed bundle and unavailable attestation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE: ${{ steps.action.outputs.review-bundle }}
          ATTEST: ${{ steps.action.outputs.review-attestation }}
        run: |
          echo "outcome: $OUTCOME"
          echo "bundle: $BUNDLE"
          echo "attestation: $ATTEST"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail without a PR number"
            exit 1
          fi
          echo "$BUNDLE" | grep -q '"schema":"review-bundle/v1"' || { echo "FAIL: bundle schema missing"; exit 1; }
          echo "$BUNDLE" | grep -q '"state":"failed"' || { echo "FAIL: bundle state is not failed"; exit 1; }
          echo "$ATTEST" | grep -q '"conclusion":"unavailable"' || { echo "FAIL: attestation not unavailable"; exit 1; }
          echo "$ATTEST" | grep -q '"reason_code":"run_crashed"' || { echo "FAIL: attestation reason not run_crashed"; exit 1; }
          if echo "$ATTEST" | grep -q '"conclusion":"approved"'; then
            echo "FAIL: a failed run must never attest approval"
            exit 1
          fi
          echo "PASS"
