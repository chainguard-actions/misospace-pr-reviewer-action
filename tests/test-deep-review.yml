name: Test deep-review and native_loop tool-mode configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "fake-key-for-test"
          pr-number: "1"
          deep-review: "false"
          tool-mode: "native_loop"
          tool-max-requests: "10"
          tool-max-rounds: "4"
          tool-loop-wall-clock-sec: "120"
          on-model-failure: "notice"
          ci-status-check: "false"
      - name: Assert deep-review and tool-mode config was accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOOL_CALLS: ${{ steps.action.outputs.tool-calls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tool-calls: $TOOL_CALLS"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            echo "PASS: action ran with deep-review=false and tool-mode=native_loop"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo with no real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
