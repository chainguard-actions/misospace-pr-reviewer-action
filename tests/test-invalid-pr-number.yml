name: Test pr-number of 0 is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: http://127.0.0.1:9/v1
          ai-model: test-model
          pr-number: "0"
          ci-status-check: "false"
          publish-mode: comment
      - name: Assert config validation failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should-review: '$SHOULD_REVIEW'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on pr-number 0"
            exit 1
          fi
          if [ -n "$SHOULD_REVIEW" ]; then
            echo "FAIL: should-review must not be written when config validation fails"
            exit 1
          fi
          echo "PASS"
