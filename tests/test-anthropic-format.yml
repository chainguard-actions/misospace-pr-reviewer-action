name: Test anthropic API format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.anthropic.com"
          ai-api-format: "anthropic"
          ai-model: "claude-3-5-haiku-20241022"
          ai-api-key: "invalid-key-for-test"
          anthropic-version: "2023-06-01"
          pr-number: "1"
          ci-status-check: "false"
          on-model-failure: "notice"
          ai-primary-retries: "0"
          ai-primary-retry-delay-sec: "0"
      - name: Assert action ran or failed gracefully with anthropic format
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "should-review: $SHOULD_REVIEW"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with anthropic format"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / invalid key with anthropic format)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
