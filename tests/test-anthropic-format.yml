name: Test anthropic API format is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with anthropic API format and nonexistent PR
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://api.anthropic.invalid"
          ai_model: "claude-3-5-sonnet-20241022"
          ai_api_format: "anthropic"
          anthropic_version: "2023-06-01"
          pr_number: "999999999"
          repo: ${{ github.repository }}
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert action failed (anthropic format accepted; failed at PR lookup or AI call)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the PR does not exist or the AI
          # endpoint is unreachable. If ai_api_format=anthropic were rejected,
          # the failure would happen at config validation in run_review.sh.
          # Either way, the action must fail (not succeed).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when PR does not exist"
            exit 1
          fi
          echo "PASS: anthropic format accepted; action failed at PR lookup or AI call as expected"
