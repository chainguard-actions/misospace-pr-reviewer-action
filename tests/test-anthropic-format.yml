name: Test anthropic API format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.anthropic.com"
          ai-api-format: "anthropic"
          ai-model: "claude-3-5-haiku-20241022"
          ai-api-key: "test-key-not-used"
          anthropic-version: "2023-06-01"
          pr-number: "1"
          on-model-failure: "notice"
          ci-status-check: "false"
          publish-review-comment: "false"
          tool-mode: "off"
      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
