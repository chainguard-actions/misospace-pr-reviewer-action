name: Test Anthropic API format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts ai_api_format=anthropic and handles
      # the Anthropic-specific parameters (anthropic_version header).
      # The AI endpoint is unreachable; on_model_failure=notice means the
      # action posts a notice instead of failing.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr_number: "1"
          ai_base_url: "http://127.0.0.1:19999"
          ai_api_format: "anthropic"
          ai_model: "claude-3-5-sonnet-20241022"
          ai_api_key: "test-key"
          anthropic_version: "2023-06-01"
          on_model_failure: "notice"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"
          publish_review_comment: "false"
          publish_mode: "comment"
          skip_if_diff_unchanged: "false"
          force_review: "true"

      - name: Assert action ran with anthropic format
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with anthropic format (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success or failure)"
            exit 1
          fi
