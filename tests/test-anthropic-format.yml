name: Test anthropic API format input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.anthropic.com"
          ai-api-format: "anthropic"
          ai-model: "claude-3-haiku-20240307"
          ai-api-key: "test-key"
          pr-number: "1"
          on-model-failure: "notice"
          ci-status-check: "false"
          tool-mode: "off"
          ai-primary-retries: "0"
          anthropic-version: "2023-06-01"

      - name: Assert action ran with anthropic format
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          # The action should either succeed (notice verdict on model failure)
          # or fail gracefully on the sentinel repo. Either is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with anthropic format"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or auth failure expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
