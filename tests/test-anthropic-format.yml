name: Test Anthropic API format configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.anthropic.com"
          ai-api-format: "anthropic"
          ai-model: "claude-3-5-haiku-20241022"
          ai-api-key: "fake-key-for-test"
          pr-number: "1"
          anthropic-version: "2023-06-01"
          ai-max-tokens: "16384"
          on-model-failure: "notice"
          ci-status-check: "false"
      - name: Assert Anthropic format config was accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          ANALYSIS_ENGINE: ${{ steps.action.outputs.analysis-engine }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "analysis-engine: $ANALYSIS_ENGINE"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            echo "PASS: action ran with anthropic format"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo with no real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
