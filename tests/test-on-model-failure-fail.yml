name: Test on_model_failure=fail behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          pr_number: "1"
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          on_model_failure: "fail"
          # Reduce retries to speed up the test
          ai_primary_retries: "0"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert action failed (sentinel repo or model failure with on_model_failure=fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          # The action should fail because:
          # 1. The sentinel repo / PR doesn't exist → precheck API calls fail, OR
          # 2. The AI model call fails (no valid key) → on_model_failure=fail exits 1
          # Either way, the step must not succeed with should_review=true.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (sentinel repo or model failure)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$SHOULD_REVIEW" = "false" ]; then
              echo "PASS: action skipped review (should_review=false)"
            else
              echo "FAIL: action succeeded unexpectedly with on_model_failure=fail"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
