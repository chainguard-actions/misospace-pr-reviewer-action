name: Test on-model-failure=fail behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          pr-number: "1"
          on-model-failure: "fail"
          ci-status-check: "false"
          tool-mode: "off"

      - name: Assert action ran (fail mode configured, sentinel repo causes graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          SKIP_REASON: ${{ steps.action.outputs.skip-reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "skip-reason: $SKIP_REASON"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — verifying outputs"
            if [ -z "$VERDICT" ] && [ -z "$SKIP_REASON" ]; then
              echo "FAIL: action succeeded but produced no verdict or skip-reason"
              exit 1
            fi
            echo "PASS: action succeeded with outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (sentinel repo not resolvable or model failure with fail mode)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
