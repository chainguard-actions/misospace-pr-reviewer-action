name: Test on-model-failure=fail behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "test-key-not-used"
          pr-number: "1"
          on-model-failure: "fail"
          ci-status-check: "false"
          publish-review-comment: "false"
          tool-mode: "off"
      - name: Assert action failed (model failure or sentinel repo not resolvable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (on-model-failure=fail or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (may have short-circuited)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
