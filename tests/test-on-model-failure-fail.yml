name: Test on-model-failure=fail behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "fake-key-for-test"
          pr-number: "1"
          ci-status-check: "false"
          publish-review-comment: "false"
          on-model-failure: "fail"
      - name: Assert action ran (failed gracefully on sentinel repo or model failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with verdict: $VERDICT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (sentinel repo not resolvable or model failure with on-model-failure=fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
