name: Test on_model_failure=fail behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action fails when pr_number is missing and on_model_failure=fail.
      # The action should fail at the precheck step before even reaching the model call,
      # or at the model call step if the precheck somehow passes.
      # skip_if_diff_unchanged=false ensures no fingerprint-based skip can mask
      # the failure by causing the action to exit 0 with should_review=false.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # pr_number intentionally omitted
          ai_base_url: "http://127.0.0.1:19999/v1"
          ai_model: "test-model"
          on_model_failure: "fail"
          skip_if_diff_unchanged: "false"
          ai_primary_retries: "0"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with on_model_failure=fail and missing PR, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when pr_number was missing"
