name: Test on-model-failure=fail mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "fake-key-for-test"
          pr-number: "1"
          on-model-failure: "fail"
          ai-primary-retries: "0"
          ci-status-check: "false"
      - name: Assert on-model-failure=fail causes step failure on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          # With on-model-failure=fail and a sentinel repo (no real PR),
          # the action should fail (either from no PR found or from model failure)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with on-model-failure=fail on sentinel repo"
          elif [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded - checking outputs"
            echo "PASS: action ran successfully (PR may have been found or model responded)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
