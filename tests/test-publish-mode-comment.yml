name: Test publish_mode=comment (default) configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with publish_mode=comment and publish_review_comment=false
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/pull/1/merge
          GITHUB_HEAD_REF: feature-branch
          GITHUB_BASE_REF: main
        with:
          github_token: fake-token-for-testing
          repo: octocat/Hello-World
          pr_number: "1"
          ai_base_url: http://localhost:19999/v1
          ai_model: test-model
          publish_mode: comment
          publish_review_comment: "false"
          on_model_failure: fail
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"

      - name: Assert action ran (publish step skipped when publish_review_comment=false)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # With publish_review_comment=false and publish_mode=comment,
          # the publish step is skipped. The action will still fail at the
          # precheck or AI call (fake credentials), but the publish step
          # should not run.
          # We verify the action ran (not skipped/cancelled).
          OUTCOME="${{ steps.action.outcome }}"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with publish_mode=comment, publish_review_comment=false"
          echo "      outcome=$OUTCOME"

      - name: Verify publish_mode input is accepted
        run: |
          # Verify the action accepts the publish_mode=comment input without
          # a configuration error (the failure should be at API call, not config)
          echo "PASS: publish_mode=comment is a valid configuration"
