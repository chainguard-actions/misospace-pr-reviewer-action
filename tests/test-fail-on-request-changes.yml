name: Test fail-on-request-changes input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "invalid-key-for-test"
          pr-number: "1"
          ci-status-check: "false"
          on-model-failure: "notice"
          fail-on-request-changes: "true"
          ai-primary-retries: "0"
          ai-primary-retry-delay-sec: "0"
      - name: Assert action ran or failed gracefully with fail-on-request-changes
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
          SKIP_REASON: ${{ steps.action.outputs.skip-reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "should-review: $SHOULD_REVIEW"
          echo "skip-reason: $SKIP_REASON"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (review skipped or notice posted)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / model failure with fail-on-request-changes)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
