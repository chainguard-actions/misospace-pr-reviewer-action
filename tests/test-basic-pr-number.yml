name: Test basic review with explicit pr-number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 10
        with:
          ai-base-url: http://127.0.0.1:9/v1
          ai-model: test-model
          pr-number: "1"
          ci-status-check: "false"
          ai-primary-retries: "0"
          ai-primary-retry-delay-sec: "1"
          ai-request-timeout-sec: "10"
          ai-connect-timeout-sec: "5"
          tool-mode: "off"
          deep-review: "false"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.should-review }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should-review: $RESULT"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "true" ] && [ "$RESULT" != "false" ]; then
              echo "FAIL: action succeeded but should-review is not true/false"
              exit 1
            fi
            echo "PASS: should-review='$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
