name: Test precheck outputs with mock PR
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock gh binary
        run: |
          mkdir -p /tmp/mock-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gh.sh" /tmp/mock-bin/gh
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - name: Run action to test precheck outputs (AI review will fail, that is OK)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: "test/repo"
          pr_number: "1"
          # Use an unreachable endpoint — we only care about precheck outputs
          ai_base_url: "http://127.0.0.1:19999/v1"
          ai_model: "test-model"
          ai_api_key: "test-key"
          on_model_failure: "notice"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"
          publish_review_comment: "false"
          publish_mode: "comment"
          # Force review so should_review=true
          force_review: "true"
          skip_if_diff_unchanged: "false"

      - name: Assert should_review output is true
        env:
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "should_review: $SHOULD_REVIEW"
          if [ "$SHOULD_REVIEW" != "true" ]; then
            echo "FAIL: should_review must be 'true' when force_review=true, got: '$SHOULD_REVIEW'"
            exit 1
          fi
          echo "PASS: should_review=true"

      - name: Assert diff_fingerprint output is set
        env:
          DIFF_FINGERPRINT: ${{ steps.action.outputs.diff_fingerprint }}
        run: |
          echo "diff_fingerprint: $DIFF_FINGERPRINT"
          if [ -z "$DIFF_FINGERPRINT" ]; then
            echo "FAIL: diff_fingerprint should be set (non-empty)"
            exit 1
          fi
          echo "PASS: diff_fingerprint is set: $DIFF_FINGERPRINT"

      - name: Assert effective_review_scope output is valid
        env:
          EFFECTIVE_SCOPE: ${{ steps.action.outputs.effective_review_scope }}
        run: |
          echo "effective_review_scope: $EFFECTIVE_SCOPE"
          if [ -z "$EFFECTIVE_SCOPE" ]; then
            echo "FAIL: effective_review_scope should be set"
            exit 1
          fi
          if [ "$EFFECTIVE_SCOPE" != "full" ] && [ "$EFFECTIVE_SCOPE" != "incremental" ]; then
            echo "FAIL: effective_review_scope must be 'full' or 'incremental', got: '$EFFECTIVE_SCOPE'"
            exit 1
          fi
          echo "PASS: effective_review_scope is valid: $EFFECTIVE_SCOPE"
