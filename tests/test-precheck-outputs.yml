name: Test precheck outputs structure
# Tests that the action's precheck step emits the expected output keys
# when it exits early due to a missing REPO or PR_NUMBER. The action
# should fail (not silently skip) in this case, which is the correct
# behavior for a misconfigured workflow.
on:
  workflow_dispatch:

jobs:
  test-precheck:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install GitHub CLI (gh) if not present
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update -qq
            apt-get install -y -qq gh
          fi
          gh --version

      - name: Run action with missing PR number (no event context)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          ai_base_url: http://localhost:11434/v1
          ai_model: test-model
          repo: ""
          pr_number: ""

      - name: Assert action failed (no REPO or PR_NUMBER resolvable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when repo and pr_number are empty, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with empty repo and pr_number"

      - name: Verify should_review output is not 'true' when action failed
        env:
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "should_review: '$SHOULD_REVIEW'"
          # When the precheck fails (exits non-zero), should_review is not set to 'true'
          if [ "$SHOULD_REVIEW" = "true" ]; then
            echo "FAIL: should_review should not be 'true' when action failed"
            exit 1
          fi
          echo "PASS: should_review is not 'true' as expected"
