name: Test precheck outputs with nonexistent PR
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with nonexistent PR number
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://api.example.invalid/v1"
          ai_model: "gpt-4o"
          pr_number: "999999999"
          repo: ${{ github.repository }}
          force_review: "false"
          skip_if_diff_unchanged: "true"
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert precheck produced should_review output and action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          DIFF_FINGERPRINT: ${{ steps.action.outputs.diff_fingerprint }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "diff_fingerprint: $DIFF_FINGERPRINT"
          # The precheck step tolerates a missing PR (gh pr diff failure → empty diff,
          # gh pr get failure → empty object). It sets should_review=true since there
          # is no prior managed review fingerprint. The action then fails at the
          # context-gathering step because the PR doesn't exist.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for nonexistent PR"
            exit 1
          fi
          # The precheck should have set should_review=true (no prior review exists)
          if [ "$SHOULD_REVIEW" != "true" ]; then
            echo "WARN: should_review was '$SHOULD_REVIEW' (expected 'true' for first review)"
          fi
          echo "PASS: action correctly failed for nonexistent PR number"
