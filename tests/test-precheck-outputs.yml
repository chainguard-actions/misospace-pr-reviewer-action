name: Test precheck outputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's precheck step (check_review_needed.sh) tolerates PR API
      # failures gracefully — it sets pr.diff to empty and pr-object.json to {}
      # when the GitHub API returns an error. With no prior managed comment,
      # should_review will be 'true' and diff_fingerprint will be set.
      # The review step will then try to call the AI API; we point it at an
      # unreachable endpoint and use on_model_failure=notice so the action
      # doesn't hard-fail. The publish step may fail on the sentinel repo.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr_number: "1"
          ai_base_url: "http://127.0.0.1:19999"
          ai_model: "test-model"
          ai_api_key: "test-key"
          on_model_failure: "notice"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"
          publish_review_comment: "false"
          publish_mode: "comment"
          skip_if_diff_unchanged: "false"
          force_review: "true"

      - name: Assert should_review output is set
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          DIFF_FP: ${{ steps.action.outputs.diff_fingerprint }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "diff_fingerprint: $DIFF_FP"
          # The precheck step always runs and sets should_review.
          # With force_review=true and skip_if_diff_unchanged=false, should_review=true.
          # The action may succeed or fail depending on whether the AI/publish steps work.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success or failure)"
            exit 1
          fi
          # diff_fingerprint should always be set by the precheck step
          if [ -n "$DIFF_FP" ]; then
            echo "PASS: diff_fingerprint is set: $DIFF_FP"
          else
            echo "WARN: diff_fingerprint is empty (precheck may not have completed)"
          fi
