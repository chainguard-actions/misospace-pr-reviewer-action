name: Test runtime dependency validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify required tools are available
        run: |
          echo "Checking runtime dependencies..."
          missing=0
          for cmd in jq curl git python3; do
            if command -v "$cmd" > /dev/null 2>&1; then
              echo "PASS: $cmd found at $(command -v $cmd)"
            else
              echo "FAIL: $cmd not found"
              missing=1
            fi
          done
          # gh may or may not be available; the action installs a mock for tests
          # that need it. Just report its status.
          if command -v gh > /dev/null 2>&1; then
            echo "INFO: gh found at $(command -v gh)"
          else
            echo "INFO: gh not found in PATH (will be mocked for tests that need it)"
          fi
          if [ "$missing" -eq 1 ]; then
            echo "FAIL: one or more required tools are missing"
            exit 1
          fi
          echo "All core runtime dependencies (jq, curl, git, python3) are present"

      - name: Set up mock gh binary
        run: |
          mkdir -p /tmp/mock-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gh.sh" /tmp/mock-bin/gh
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - name: Run action with missing PR number (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # No pr_number — action will fail at precheck (Missing REPO or PR_NUMBER)
          ai_base_url: "https://api.example.invalid/v1"
          ai_model: "test-model"

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR number), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when PR_NUMBER was not provided"
