name: Test dependency check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          # No pr_number — action fails at precheck (missing PR_NUMBER).
          # The first composite step validates runtime deps (gh, jq, curl, git, python3).
          # If any dep is missing, the action fails at that step.
          # Either way, continue-on-error keeps the job alive.
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert action ran (dependency check passed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The dependency check step always runs first. On ubuntu-latest all
          # deps (gh, jq, curl, git, python3) are present, so the action
          # proceeds past the dependency check and fails at the precheck step
          # (missing PR_NUMBER). Either outcome is acceptable here.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with no PR number)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
