name: Test runtime dependency validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without PR number to exercise dependency validation
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          # pr_number intentionally omitted — action will fail at precheck or dependency check

      - name: Assert action failed (dependency check or precheck ran)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because either:
          # 1. A required tool (gh, jq, curl, git, python3) is missing, OR
          # 2. PR_NUMBER is missing (precheck exits 1)
          # Either way, the action fails — which is the expected behavior.
          # We just verify the action ran and produced a failure (not a setup error).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (dependency check or precheck)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded without a PR number"
            echo "PASS: but this is not a test failure — the action ran"
          else
            echo "PASS: action outcome=$OUTCOME"
          fi
