name: Test tool-mode native_loop configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "http://127.0.0.1:19999/v1"
          ai-model: "test-model"
          ai-api-key: "test-key"
          pr-number: "1"
          on-model-failure: "notice"
          tool-mode: "native_loop"
          tool-max-requests: "5"
          tool-max-rounds: "3"
          tool-loop-wall-clock-sec: "60"
          tool-turn-timeout-sec: "30"
          tool-failure-enforcement: "false"
          ci-status-check: "false"
          ai-primary-retries: "0"

      - name: Assert action ran with native_loop tool mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOOL_CALLS: ${{ steps.action.outputs.tool-calls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tool-calls: $TOOL_CALLS"
          # The action should either succeed or fail gracefully on the sentinel repo.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with expected outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
