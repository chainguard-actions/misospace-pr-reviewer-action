name: Test tool-mode=native_loop configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "test-key-not-used"
          pr-number: "1"
          tool-mode: "native_loop"
          tool-max-requests: "5"
          tool-max-rounds: "3"
          tool-loop-wall-clock-sec: "120"
          tool-failure-enforcement: "false"
          on-model-failure: "notice"
          ci-status-check: "false"
          publish-review-comment: "false"
      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOOL_CALLS: ${{ steps.action.outputs.tool-calls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tool-calls: $TOOL_CALLS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
