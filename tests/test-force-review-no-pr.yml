name: Test force_review with no PR number fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with force_review=true but no PR number (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          force_review: "true"
          skip_if_diff_unchanged: "false"
          # pr_number intentionally omitted — should fail at precheck

      - name: Assert action failed due to missing PR number even with force_review
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when PR_NUMBER is missing (even with force_review=true)"
            exit 1
          fi
          echo "PASS: action correctly failed when PR_NUMBER was not provided, even with force_review=true"
