name: Test action input acceptance and on_model_failure=notice
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with on_model_failure=notice and extended inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          pr_number: "1"
          platform: "github"
          on_model_failure: "notice"
          fail_on_request_changes: "false"
          skip_if_diff_unchanged: "true"
          force_review: "false"
          publish_mode: "comment"
          publish_review_comment: "false"
          ai_api_format: "openai"
          ai_max_tokens: "8192"
          ai_temperature: "0.1"
          verdict_policy: "model"
          review_scope: "auto"
          context_limit_mode: "normal"
          tool_mode: "off"
          # Minimize retry time so the test completes quickly.
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_connect_timeout_sec: "5"
          ai_request_timeout_sec: "10"

      - name: Assert action ran (inputs accepted, sentinel repo handled)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          SKIP_REASON: ${{ steps.action.outputs.skip_reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "skip_reason: $SKIP_REASON"

          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME' (inputs accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
