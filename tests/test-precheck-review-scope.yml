name: Test precheck outputs effective_review_scope=full
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake gh CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          # pr_number=1 matches the fake PR object returned by fake-gh.sh
          pr_number: "1"
          ai_base_url: "http://localhost:9999"
          ai_model: "test-model"
          on_model_failure: "notice"
          # Explicitly request full scope
          review_scope: "full"
          # Minimize retry wait time so the test completes quickly
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_connect_timeout_sec: "2"
          ai_request_timeout_sec: "5"
          # Do not publish (no real PR to comment on)
          publish_review_comment: "false"
          publish_mode: "comment"
          skip_if_diff_unchanged: "false"

      - name: Assert effective_review_scope is full
        env:
          SCOPE: ${{ steps.action.outputs.effective_review_scope }}
        run: |
          echo "effective_review_scope: $SCOPE"
          if [ "$SCOPE" != "full" ]; then
            echo "FAIL: expected effective_review_scope=full, got '$SCOPE'"
            exit 1
          fi
          echo "PASS: effective_review_scope=full"

      - name: Assert should_review is true
        env:
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "should_review: $SHOULD_REVIEW"
          if [ "$SHOULD_REVIEW" != "true" ]; then
            echo "FAIL: expected should_review=true, got '$SHOULD_REVIEW'"
            exit 1
          fi
          echo "PASS: should_review=true"

      - name: Assert diff_fingerprint is non-empty
        env:
          FINGERPRINT: ${{ steps.action.outputs.diff_fingerprint }}
        run: |
          echo "diff_fingerprint: $FINGERPRINT"
          if [ -z "$FINGERPRINT" ]; then
            echo "FAIL: expected non-empty diff_fingerprint"
            exit 1
          fi
          echo "PASS: diff_fingerprint is non-empty"
