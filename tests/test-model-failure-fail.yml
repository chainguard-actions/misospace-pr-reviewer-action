name: Test on-model-failure=fail behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "http://127.0.0.1:19999/v1"
          ai-model: "test-model"
          ai-api-key: "test-key"
          pr-number: "1"
          on-model-failure: "fail"
          ci-status-check: "false"
          tool-mode: "off"
          ai-primary-retries: "0"

      - name: Assert action failed (model failure with fail mode, or sentinel repo failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With on-model-failure=fail and an unreachable AI endpoint,
          # the action should fail. The sentinel repo may also cause failure
          # before reaching the AI call. Either way, failure is expected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (model failure or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (sentinel repo may have caused early exit)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
