name: Test verdict-policy=model (v2 passthrough)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          pr-number: "1"
          verdict-policy: "model"
          non-blocking-finding-categories: ""
          inline-findings: "true"
          inline-findings-max: "10"
          ci-status-check: "false"
          tool-mode: "off"

      - name: Assert action ran with verdict-policy=model
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          VERDICT_SOURCE: ${{ steps.action.outputs.verdict-source }}
          FINDINGS: ${{ steps.action.outputs.findings }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "verdict-source: $VERDICT_SOURCE"
          echo "findings: $FINDINGS"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            # If verdict is set, verdict-source should also be set
            if [ -n "$VERDICT" ] && [ -z "$VERDICT_SOURCE" ]; then
              echo "FAIL: verdict is set but verdict-source is empty"
              exit 1
            fi
            # If findings is set, it should be a JSON array
            if [ -n "$FINDINGS" ]; then
              if ! echo "$FINDINGS" | grep -qE '^\['; then
                echo "FAIL: findings output is not a JSON array: $FINDINGS"
                exit 1
              fi
            fi
            echo "PASS: action completed with consistent outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
