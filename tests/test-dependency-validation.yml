name: Test runtime dependency validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify core runtime tools are available
        run: |
          echo "Checking core runtime dependencies..."
          for cmd in jq curl git python3; do
            if command -v "$cmd" > /dev/null 2>&1; then
              echo "PASS: $cmd found at $(command -v $cmd)"
            else
              echo "FAIL: $cmd not found"
              exit 1
            fi
          done
          # gh CLI is checked separately — it may not be present in all act images
          if command -v gh > /dev/null 2>&1; then
            echo "INFO: gh found at $(command -v gh)"
          else
            echo "INFO: gh not found (action will fail at dependency validation)"
          fi
          echo "Core runtime dependencies check complete"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          pr_number: "1"
          # Short timeouts and no retries so the action fails fast when the
          # AI endpoint is unreachable in the test environment.
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "5"
          ai_primary_retries: "0"

      - name: Assert action started (dependency validation passed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail at the API/PR level,
          # not crash the workflow. Both success and failure are acceptable here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past dependency validation (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
