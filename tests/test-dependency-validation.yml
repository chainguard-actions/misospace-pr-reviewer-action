name: Test runtime dependency validation passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure at review, not at dependency validation)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://api.example.invalid/v1"
          ai_model: "gpt-4o"
          pr_number: "999999999"
          repo: ${{ github.repository }}
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert action failed (dependency validation passed, failed later)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the PR does not exist or the AI
          # endpoint is unreachable — not because a runtime dependency is missing.
          # If it had failed at the dependency validation step, the error would
          # be about a missing tool (gh/jq/curl/git/python3).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (nonexistent PR / invalid AI URL), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (dependency validation passed)"
