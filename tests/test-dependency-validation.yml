name: Test dependency validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with a fake PR number and a fake AI endpoint.
      # The action's first step validates runtime dependencies (gh, jq, curl, git, python3).
      # If dependencies are missing, the action fails gracefully.
      # The precheck step will fail to fetch the PR (sentinel repo), but it
      # tolerates that gracefully. The review step is gated on should_review,
      # which will be 'true' (no prior fingerprint). The AI call will fail
      # because the endpoint is unreachable; on_model_failure=notice means the
      # action posts a notice instead of failing the step.
      # We use continue-on-error because the publish step may also fail on the
      # sentinel repo.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr_number: "1"
          ai_base_url: "http://127.0.0.1:19999"
          ai_model: "test-model"
          ai_api_key: "test-key"
          on_model_failure: "notice"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"
          publish_review_comment: "false"
          publish_mode: "comment"

      - name: Assert action ran (precheck outputs set or failed gracefully)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          DIFF_FP: ${{ steps.action.outputs.diff_fingerprint }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "diff_fingerprint: $DIFF_FP"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success or failure)"
            exit 1
          fi
