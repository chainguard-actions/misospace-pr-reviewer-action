name: Test - Runtime dependency validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (dependency check is the first step; no PR context so precheck exits fast)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ai_base_url: "https://localhost:19999/v1"
          ai_model: "test-model"
          pr_number: ""
          skip_if_diff_unchanged: "false"
          force_review: "false"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"

      - name: Assert action ran (dependency validation step runs before precheck exits)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action's first step validates dependencies (gh, jq, curl, git, python3).
          # With no PR number, the precheck exits immediately after that.
          # Expected: failure (precheck exits 1 on missing PR_NUMBER) or
          #           success (unlikely but acceptable).
          # Not acceptable: skipped (means a prior step failed before the action ran).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past dependency validation (outcome=$OUTCOME)"
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped — a prior step may have failed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
