name: Test runtime dependency validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify required runtime tools are present
        run: |
          echo "Checking for required runtime dependencies..."
          MISSING=0
          for cmd in jq curl git python3; do
            if ! command -v "$cmd" > /dev/null 2>&1; then
              echo "FAIL: required command '$cmd' not found"
              MISSING=1
            else
              echo "  OK: $cmd found at $(command -v $cmd)"
            fi
          done
          # gh may or may not be installed; the action installs it if needed
          if command -v gh > /dev/null 2>&1; then
            echo "  OK: gh found at $(command -v gh)"
          else
            echo "  INFO: gh not found (action will handle this)"
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "FAIL: one or more required dependencies are missing"
            exit 1
          fi
          echo "PASS: core runtime dependencies (jq, curl, git, python3) are present"

      - name: Run action dependency check step (no PR number - expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
        with:
          github_token: fake-token
          ai_base_url: http://localhost:11434/v1
          ai_model: llama3

      - name: Assert action ran (outcome is failure due to missing PR number)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because PR_NUMBER is not set for a push event.
          # Any outcome other than 'success' is acceptable here — we just verify
          # the action ran and didn't crash the runner itself.
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: unexpected success — action should fail without a PR number"
            exit 1
          fi
          echo "PASS: action correctly failed (no PR number for push event)"
