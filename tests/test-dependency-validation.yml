name: Test runtime dependency validation passes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Verify that all required runtime dependencies (gh, jq, curl, git, python3)
      # are available on the runner. Log their presence without failing the test
      # if any are missing — the action's own dependency step will catch that.
      - name: Log available runtime tools
        run: |
          echo "Checking required runtime dependencies..."
          for tool in gh jq curl git python3; do
            if command -v "$tool" > /dev/null 2>&1; then
              echo "OK: $tool is available at $(command -v $tool)"
            else
              echo "WARN: $tool is NOT available (action will catch this)"
            fi
          done

      # Invoke the action without a PR number so it fails fast at the precheck
      # step (missing PR_NUMBER → immediate exit 1). skip_if_diff_unchanged=false
      # ensures no fingerprint-based skip can mask the failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # pr_number intentionally omitted — precheck exits immediately
          ai_base_url: "http://127.0.0.1:19999/v1"
          ai_model: "test-model"
          skip_if_diff_unchanged: "false"
          ai_primary_retries: "0"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"

      - name: Assert action failed (dependency validation passed, precheck failed as expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because PR_NUMBER is missing (precheck exits 1)
          # or because the AI API is unreachable (review step fails).
          # Either way, the outcome must be 'failure'.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pr_number is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed (precheck or review step failed as expected)"
