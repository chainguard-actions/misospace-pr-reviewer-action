name: Test runtime dependency validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's first step validates runtime dependencies (gh, jq, curl,
      # git, python3). We invoke the action and verify it either:
      # - Succeeds (all deps present, action ran to completion or skipped)
      # - Fails gracefully (deps missing or no valid PR — not a crash)
      # We do NOT directly check for gh here because it may not be in the
      # act container's PATH; the action's own validation step covers it.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: http://127.0.0.1:1
          ai_model: test-model
          pr_number: "99999999"
          repo: "actions/checkout"
          ai_primary_retries: "0"
          ai_connect_timeout_sec: "2"
          ai_request_timeout_sec: "5"

      - name: Assert action outcome is not unexpected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (dependency validation step passed or failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
