name: Test anthropic API format input
# Tests that the ai_api_format=anthropic input is accepted by the action
# without input validation errors. The action should fail at the precheck
# step (missing REPO/PR_NUMBER) rather than at input parsing, confirming
# the anthropic format is a recognized and valid input value.
on:
  workflow_dispatch:

jobs:
  test-anthropic-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install GitHub CLI (gh) if not present
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update -qq
            apt-get install -y -qq gh
          fi
          gh --version

      - name: Run action with ai_api_format=anthropic
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          ai_base_url: https://api.anthropic.com
          ai_model: claude-3-5-sonnet-20241022
          ai_api_format: anthropic
          ai_api_key: fake-anthropic-key
          anthropic_version: "2023-06-01"
          repo: ""
          pr_number: ""

      - name: Assert action failed at precheck (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail at precheck, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: ai_api_format=anthropic input was accepted; action failed at precheck as expected"
