name: Test skip behavior when no PR context is available
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "https://api.openai.com/v1"
          ai-model: "gpt-4o-mini"
          ai-api-key: "test-key-not-real"
          ci-status-check: "false"
          on-model-failure: "notice"
      - name: Assert action ran or failed gracefully with no PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
          SKIP_REASON: ${{ steps.action.outputs.skip-reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should-review: $SHOULD_REVIEW"
          echo "skip-reason: $SKIP_REASON"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ "$SHOULD_REVIEW" = "false" ]; then
              echo "PASS: action correctly determined no review needed (no PR context)"
            else
              echo "PASS: action ran with available context"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no PR number in workflow_dispatch context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
