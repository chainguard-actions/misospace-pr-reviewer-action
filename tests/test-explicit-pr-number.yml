name: Test explicit pr-number (sentinel repository)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The PR read is a repo-scoped API call keyed on the sentinel
      # GITHUB_REPOSITORY, so it cannot succeed under the harness. The action
      # must fail closed (never treat a lookup failure as a skip/approval).
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: http://127.0.0.1:9/v1
          ai-model: test-model
          pr-number: "1"
          ci-status-check: "false"
          tool-mode: "off"
          deep-review: "false"
      - name: Assert action ran (outputs set, or failed closed on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUNDLE: ${{ steps.action.outputs.review-bundle }}
          ATTEST: ${{ steps.action.outputs.review-attestation }}
          SHOULD: ${{ steps.action.outputs.should-review }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should-review: $SHOULD"
          echo "bundle: $BUNDLE"
          echo "attestation: $ATTEST"
          if [ -z "$BUNDLE" ] || [ -z "$ATTEST" ]; then
            echo "FAIL: review-bundle/review-attestation must be written on every run"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SHOULD" ]; then
              echo "FAIL: action succeeded but should-review is empty"
              exit 1
            fi
            echo "PASS: action succeeded with should-review=$SHOULD"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "$BUNDLE" | grep -q '"state":"failed"' || { echo "FAIL: bundle state is not failed"; exit 1; }
            if echo "$ATTEST" | grep -q '"conclusion":"approved"'; then
              echo "FAIL: failed run attested approval"
              exit 1
            fi
            echo "PASS: action failed closed (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
