name: Test missing PR number fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action without a pr_number. The precheck script exits 1 when
      # PR_NUMBER is empty, so the action should fail immediately.
      # Under workflow_dispatch, github.event.pull_request.number is empty,
      # so PR_NUMBER will be empty when pr_number input is not provided.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # pr_number intentionally omitted — no pull_request event context either
          ai_base_url: "https://localhost:19999/v1"
          ai_model: "test-model"

      - name: Assert action failed due to missing PR number
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          case "$OUTCOME" in
            failure)
              echo "PASS: action correctly failed when PR number is missing"
              ;;
            success)
              echo "FAIL: action should have failed without a PR number"
              exit 1
              ;;
            "")
              # Empty outcome may occur in some act versions; use file-based check
              echo "INFO: outcome expression returned empty — checking files instead"
              # The precheck script exits before creating pr.diff when PR_NUMBER is empty
              if [ -f pr.diff ]; then
                echo "FAIL: pr.diff exists — precheck ran past the PR number check"
                echo "FAIL: action should have failed before creating pr.diff"
                exit 1
              else
                echo "PASS: pr.diff not found — action failed before precheck ran (as expected)"
              fi
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
