name: Test missing PR number validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action fails fast when pr_number is not provided and
      # there is no pull_request event context (workflow_dispatch has no PR number).
      # The check_review_needed.sh script exits 1 when REPO or PR_NUMBER is empty.
      # Note: github.event.pull_request.number may resolve to 0 for workflow_dispatch,
      # in which case the action may proceed but fail at the AI call.
      - id: action_no_pr
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # pr_number intentionally omitted — workflow_dispatch has no PR context
          ai_base_url: "http://127.0.0.1:19999"
          ai_model: "test-model"
          ai_api_key: "test-key"
          on_model_failure: "fail"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"
          publish_review_comment: "false"
          publish_mode: "comment"

      - name: Assert action failed due to missing PR number
        if: always()
        env:
          OUTCOME: ${{ steps.action_no_pr.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a pr_number and without a pull_request event, the precheck
          # script exits 1 ("Missing REPO or PR_NUMBER for review precheck").
          # The action should fail (not succeed or be skipped).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (missing PR number)"
          elif [ "$OUTCOME" = "success" ]; then
            # This can happen if PR_NUMBER resolved to "0" from the event context
            # and the action proceeded but failed gracefully at the AI call.
            # In that case, the action still ran, which is acceptable.
            echo "PASS: action ran (PR_NUMBER may have resolved to 0 from event context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected failure or success)"
            exit 1
          fi
