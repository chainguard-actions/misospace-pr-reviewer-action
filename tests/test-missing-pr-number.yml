name: Test missing PR number fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires pr_number (or a pull_request event context).
      # When neither is provided, the precheck step must exit with a non-zero
      # code and a clear error message. We verify the action fails as expected.
      # skip_if_diff_unchanged=false ensures no fingerprint-based skip can mask
      # the failure by causing the action to exit 0 with should_review=false.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # pr_number intentionally omitted — no pull_request event context either
          ai_base_url: "http://127.0.0.1:19999/v1"
          ai_model: "test-model"
          skip_if_diff_unchanged: "false"
          ai_primary_retries: "0"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"

      - name: Assert action failed due to missing PR number
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "should_review: '$SHOULD_REVIEW'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pr_number is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when pr_number was not provided"
          # When the action fails, should_review must not be 'true' with a
          # successful review — either the precheck failed (empty) or the
          # review step failed after precheck set should_review=true.
          # Both are acceptable failure modes.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (should_review='$SHOULD_REVIEW' is acceptable)"
          fi
