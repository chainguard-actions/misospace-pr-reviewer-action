name: Test missing PR number fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake gh CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" "$HOME/.local/bin/gh"
          chmod +x "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # pr_number intentionally omitted — no pull_request event context either
          ai_base_url: "http://localhost:9999"
          ai_model: "test-model"
          ai_primary_retries: "1"
          ai_primary_retry_delay_sec: "0"
          ai_connect_timeout_sec: "2"
          ai_request_timeout_sec: "5"

      - name: Assert action failed due to missing PR number
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pr_number is not provided, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when PR number was missing"
