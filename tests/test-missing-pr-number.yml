name: Test missing PR number fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # pr_number intentionally omitted — no pull_request event context
          # repo intentionally omitted — will use sentinel repo
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          # Reduce retries and timeouts so the test completes quickly
          ai_primary_retries: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert action failed due to missing PR number
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When pr_number is not set and there is no pull_request event,
          # PR_NUMBER is empty. The check_review_needed.sh script exits 1
          # immediately: "Missing REPO or PR_NUMBER for review precheck".
          # The action must fail — it cannot proceed without a PR number.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when PR number is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without a PR number"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected failure)"
            exit 1
          fi
