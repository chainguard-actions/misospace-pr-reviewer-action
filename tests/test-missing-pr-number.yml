name: Test missing PR number fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without PR number (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
        with:
          github_token: fake-token
          ai_base_url: http://localhost:11434/v1
          ai_model: llama3

      - name: Assert action failed due to missing PR number
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when PR number is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when PR number was not provided"
