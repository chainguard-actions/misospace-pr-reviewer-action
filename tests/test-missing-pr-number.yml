name: Test missing PR number fails precheck
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # workflow_dispatch carries no pull_request payload and pr-number is
      # unset, so the precheck must refuse to run.
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: http://127.0.0.1:9/v1
          ai-model: test-model
          ci-status-check: "false"
          publish-mode: comment
      - name: Assert action failed without writing review outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should-review: '$SHOULD_REVIEW'"
          echo "verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no PR number is available"
            exit 1
          fi
          if [ -n "$SHOULD_REVIEW" ] || [ -n "$VERDICT" ]; then
            echo "FAIL: no review outputs expected"
            exit 1
          fi
          echo "PASS"
