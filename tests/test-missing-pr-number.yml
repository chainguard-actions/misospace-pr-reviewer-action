name: Test missing PR number error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with no PR number — it should fail at the precheck step
      # because PR_NUMBER is empty and there is no pull_request event context.
      # The action may also succeed with should_review=false if the environment
      # provides a PR number from the event context.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: "https://api.example.invalid/v1"
          ai_model: "gpt-4o"
          on_model_failure: "fail"
          # pr_number intentionally omitted — no pull_request event context either
          # repo defaults to current repo

      - name: Assert action handled missing PR gracefully
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          # The action should either:
          # 1. Fail (exit 1) because PR_NUMBER is empty — outcome=failure
          # 2. Succeed with should_review=false if PR_NUMBER is somehow set
          #    but no review is needed
          # It should NOT be skipped or cancelled.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no PR number)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (may have skipped review due to no PR)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME (expected failure or success)"
            exit 1
          fi
