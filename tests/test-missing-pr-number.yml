name: Test missing PR number fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test the precheck script directly: it must exit 1 when PR_NUMBER is empty.
      # This is the primary assertion and does not depend on continue-on-error behavior.
      - name: Verify precheck exits 1 with no PR number
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ""
          GH_TOKEN: ${{ github.token }}
          GITHUB_OUTPUT: /dev/null
        run: |
          echo "Running precheck script with empty PR_NUMBER..."
          if bash action/scripts/check_review_needed.sh 2>/tmp/precheck-stderr.txt; then
            echo "FAIL: expected precheck to exit 1 with missing PR number, but it succeeded"
            cat /tmp/precheck-stderr.txt
            exit 1
          fi
          echo "PASS: precheck correctly exited non-zero with missing PR number"
          cat /tmp/precheck-stderr.txt

      # Also run the composite action to verify end-to-end behavior.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          on_model_failure: "fail"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"
          # pr_number intentionally omitted — no pull_request event context

      - name: Assert composite action failed due to missing PR number
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no PR number is provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when PR number was missing"
