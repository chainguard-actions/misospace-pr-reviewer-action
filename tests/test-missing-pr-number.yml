name: Test missing PR number
# When neither pr_number input nor a pull_request event number is available,
# the precheck step should exit with an error (missing REPO or PR_NUMBER).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # pr_number intentionally omitted — no pull_request event either
          ai_base_url: "http://localhost:19999/v1"
          ai_model: "test-model"
          ai_primary_retries: "0"
          ai_primary_retry_delay_sec: "0"

      - name: Assert action failed due to missing PR number
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when PR number is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without a PR number"
            exit 1
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped — a prior step must have failed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
