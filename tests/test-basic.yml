name: Test basic invocation (no valid PR)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires github_token, ai_base_url, and ai_model.
      # With no valid PR number on a workflow_dispatch event, the precheck
      # step will fail (missing PR_NUMBER). We assert the action fails
      # gracefully rather than with an unexpected error.
      # Use a localhost AI endpoint and 0 retries so the action fails fast
      # if it somehow reaches the model call step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          ai_base_url: http://127.0.0.1:1
          ai_model: test-model
          pr_number: "99999999"
          repo: "actions/checkout"
          ai_primary_retries: "0"
          ai_connect_timeout_sec: "2"
          ai_request_timeout_sec: "5"

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should_review }}
          SKIP_REASON: ${{ steps.action.outputs.skip_reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "should_review: $SHOULD_REVIEW"
          echo "skip_reason: $SKIP_REASON"
          # The action should either succeed (if it skips) or fail gracefully.
          # It must not produce an unexpected outcome.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (likely skipped review)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with no real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
