name: Test basic usage - graceful failure on sentinel repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          ai-base-url: "http://127.0.0.1:19999/v1"
          ai-model: "test-model"
          ai-api-key: "test-key"
          pr-number: "1"
          on-model-failure: "notice"
          ci-status-check: "false"
          tool-mode: "off"

      - name: Assert action ran and produced an outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          SHOULD_REVIEW: ${{ steps.action.outputs.should-review }}
          SKIP_REASON: ${{ steps.action.outputs.skip-reason }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "should-review: $SHOULD_REVIEW"
          echo "skip-reason: $SKIP_REASON"
          # The action should either succeed (with a notice verdict) or fail gracefully
          # on the sentinel repo (no real PR). Either is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo with no real PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
