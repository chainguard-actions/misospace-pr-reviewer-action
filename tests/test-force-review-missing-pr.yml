name: Test force_review with missing PR number
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that force_review=true still fails when pr_number is missing.
      # The force_review flag bypasses the diff-unchanged guard but cannot
      # bypass the fundamental requirement for a valid PR number.
      # The precheck script checks: if [[ -z "$REPO" || -z "$PR_NUMBER" ]]; then exit 1
      # This happens before the force_review logic is even evaluated.
      # skip_if_diff_unchanged=false is also set for belt-and-suspenders.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # pr_number intentionally omitted — force_review cannot bypass this
          ai_base_url: "http://127.0.0.1:19999/v1"
          ai_model: "test-model"
          force_review: "true"
          skip_if_diff_unchanged: "false"
          ai_primary_retries: "0"
          ai_primary_retry_delay_sec: "0"
          ai_request_timeout_sec: "5"
          ai_connect_timeout_sec: "3"

      - name: Assert action failed even with force_review=true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pr_number is missing even with force_review=true, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed — force_review cannot bypass missing PR number"

      - name: Assert diff_fingerprint output is empty
        env:
          FINGERPRINT: ${{ steps.action.outputs.diff_fingerprint }}
        run: |
          echo "diff_fingerprint: '$FINGERPRINT'"
          # When the precheck fails immediately (missing PR_NUMBER), no outputs
          # are written, so diff_fingerprint should be empty.
          if [ -n "$FINGERPRINT" ]; then
            echo "INFO: diff_fingerprint was set to '$FINGERPRINT' (precheck may have partially run)"
          else
            echo "PASS: diff_fingerprint is empty as expected when precheck fails immediately"
          fi
          echo "PASS: force_review=true does not bypass missing PR number validation"
