name: Test invalid publish-mode is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ai-base-url: http://127.0.0.1:9/v1
          ai-model: test-model
          publish-mode: shout_it_loudly
          ci-status-check: "false"
          ai-primary-retries: "0"
      - name: Assert action failed on invalid publish-mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid publish-mode"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: no verdict expected when config is invalid"
            exit 1
          fi
          echo "PASS"
