name: Test action inputs are validated correctly
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test the precheck script directly: it must exit 1 when pr_number is
      # explicitly set to empty string and there is no pull_request event.
      # This is the primary assertion and does not depend on continue-on-error.
      - name: Verify precheck exits 1 with explicit empty pr_number
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ""
          GH_TOKEN: ${{ github.token }}
          GITHUB_OUTPUT: /dev/null
        run: |
          echo "Running precheck script with explicit empty PR_NUMBER..."
          if bash action/scripts/check_review_needed.sh 2>/tmp/precheck-stderr.txt; then
            echo "FAIL: expected precheck to exit 1 with empty pr_number, but it succeeded"
            cat /tmp/precheck-stderr.txt
            exit 1
          fi
          echo "PASS: precheck correctly exited non-zero with empty pr_number"
          cat /tmp/precheck-stderr.txt

      # Also run the composite action to verify end-to-end behavior.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          pr_number: ""
          ai_base_url: "https://api.openai.com/v1"
          ai_model: "gpt-4o-mini"
          ai_api_format: "openai"
          ai_max_tokens: "8192"
          ai_temperature: "0.1"
          publish_mode: "comment"
          publish_review_comment: "false"
          skip_if_diff_unchanged: "true"
          force_review: "false"
          on_model_failure: "fail"
          verdict_policy: "model"
          review_scope: "auto"
          context_limit_mode: "normal"
          ai_primary_retries: "0"
          ai_request_timeout_sec: "10"
          ai_connect_timeout_sec: "5"

      - name: Assert composite action failed with empty pr_number
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pr_number is empty, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when pr_number was empty"
